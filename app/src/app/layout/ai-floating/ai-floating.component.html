<!-- ── Floating chat panel ──────────────────────────────────────────────── -->
<div
  id="af-panel"
  class="af-panel"
  [class.af-panel--open]="isOpen()"
  [class.af-panel--ever-opened]="hasOpened()"
  aria-label="Ask Vinoth AI"
  role="complementary">

  @if (hasOpened()) {
    <div class="af-panel__chat">
      <app-ai-chat [compact]="true" />
    </div>
  }

</div>

<!-- ── Floating trigger button ─────────────────────────────────────────── -->
<button
  class="af-btn"
  [class.af-btn--open]="isOpen()"
  (click)="toggle()"
  [attr.aria-label]="isOpen() ? 'Close AI assistant' : 'Open Ask Vinoth AI'"
  [attr.aria-expanded]="isOpen()"
  aria-controls="af-panel">

  <!-- Closed state: star icon -->
  <span class="af-btn__icon af-btn__icon--star" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2c0 0 .6 6.3 1.8 8.2C15 12 22 12 22 12s-7 0-8.2 1.8C12.6 15.7 12 22 12 22s-.6-6.3-1.8-8.2C9 12 2 12 2 12s7 0 8.2-1.8C11.4 8.3 12 2 12 2z"/>
    </svg>
  </span>

  <!-- Open state: close icon -->
  <span class="af-btn__icon af-btn__icon--close" aria-hidden="true">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </span>

  <!-- Pulse ring (closed state only) -->
  <span class="af-btn__ring" aria-hidden="true"></span>

  <!-- Label pill -->
  <span class="af-btn__label" aria-hidden="true">Ask Vinoth AI</span>

</button>
